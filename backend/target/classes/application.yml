# ==============================================================================
# WorkforceHub Application Configuration
# Phase 8A: Spring Boot Backend Foundation
# ==============================================================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: 24h
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        max-age: 86400
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false


spring:
  application:
    name: workforcehub-backend

  # PostgreSQL Datasource Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:workforcehub_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: WorkforceHubHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true

  # JPA & Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Strictly migration-compatible. Never use create or create-drop.
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway Migration Management
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

# Spring Boot Actuator Management Configuration
management:
  endpoints:
    web:
      exposure:
        # Strictly restricted to health and info diagnostic probes
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      # Conceal internal component internals from public visibility
      show-details: never
  info:
    env:
      enabled: false

# Application Custom Properties
workforcehub:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  security:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      admin-email: ${ADMIN_BOOTSTRAP_EMAIL:admin@workforcehub.io}
      admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:AdminSecure2026!}
      employee-email: ${EMPLOYEE_BOOTSTRAP_EMAIL:employee@workforcehub.io}
      employee-password: ${EMPLOYEE_BOOTSTRAP_PASSWORD:EmployeeSecure2026!}

